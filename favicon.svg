<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs>
<radialGradient cx="50%" cy="50%" id="fvBg" r="70%">
<stop offset="0%" stop-color="#0A1119"></stop>
<stop offset="100%" stop-color="#050B12"></stop>
</radialGradient>
<radialGradient cx="50%" cy="50%" id="fvGlow" r="50%">
<stop offset="0%" stop-color="#8FF7CE" stop-opacity="0.65"></stop>
<stop offset="45%" stop-color="#43D9B8" stop-opacity="0.28"></stop>
<stop offset="100%" stop-color="#43D9B8" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="fvFace" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#4C6478"></stop>
<stop offset="100%" stop-color="#212B34"></stop>
</linearGradient>
<linearGradient id="fvEdge" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#8FE0FF"></stop>
<stop offset="100%" stop-color="#2FD9B9"></stop>
</linearGradient>
<style>
.fv-ring{fill:none;stroke:#7CF2C0;stroke-width:1.6;animation:fvPing 2.6s ease-out infinite}
.fv-ring2{animation-delay:1.3s}
.fv-core{animation:fvCore 2.6s ease-in-out infinite}
.fv-glow{animation:fvGlow 2.6s ease-in-out infinite}
@keyframes fvPing{0%{r:2.5;stroke-opacity:.9}70%,100%{r:22;stroke-opacity:0}}
@keyframes fvCore{0%,100%{opacity:.75;r:1.4}50%{opacity:1;r:2}}
@keyframes fvGlow{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</defs>
<rect fill="url(#fvBg)" height="100" rx="22" width="100"></rect>
<circle class="fv-glow" cx="46" cy="22" fill="url(#fvGlow)" r="29"></circle>
<circle class="fv-ring" cx="46" cy="27" r="3"></circle>
<circle class="fv-ring fv-ring2" cx="46" cy="27" r="3"></circle>
<polygon fill="url(#fvFace)" points="46,27 21,76 79,76"></polygon>
<path d="M46,27 L21,76" fill="none" stroke="url(#fvEdge)" stroke-linecap="round" stroke-width="1.8"></path>
<path d="M46,27 L40,37 L44,35 L46,39 L48,35 L51,37 Z" fill="#9FF6D6"></path>
<circle class="fv-core" cx="46" cy="27" fill="#EFFFF7" r="1.4"></circle>
</svg>
